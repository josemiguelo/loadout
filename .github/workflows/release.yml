name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The tag must name internal/version's Version, the binary's own: a tag
  # can't publish a binary that reports another version.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches internal/version
        run: |
          version=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/version/version.go)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME but internal/version says $version"; exit 1; }

  # Go cross-compiles every target from one runner; CGO is off, so the
  # binaries are static and need nothing beside them.
  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        run: |
          for target in linux/amd64:linux-x64 linux/arm64:linux-arm64 darwin/arm64:macos-arm64 darwin/amd64:macos-x64; do
            platform="${target%%:*}"; release_name="${target##*:}"
            mkdir -p "dist-$release_name"
            CGO_ENABLED=0 GOOS="${platform%/*}" GOARCH="${platform#*/}" \
              go build -trimpath -ldflags='-s -w' -o "dist-$release_name/loadout" ./cmd/loadout
            tar -C "dist-$release_name" -czf "loadout-${GITHUB_REF_NAME}-$release_name.tar.gz" loadout
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: loadout-*.tar.gz
