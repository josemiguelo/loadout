name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The tag must name src/version.ts's VERSION, the binary's own: a tag
  # can't publish a binary that reports another version.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches src/version.ts
        run: |
          version=$(sed -n 's/^export const VERSION = "\(.*\)";$/\1/p' src/version.ts)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME but src/version.ts says $version"; exit 1; }

  # bun cross-compiles every target from one runner. Each binary carries
  # its bun: the Linux ones need glibc, the macOS ones come ad-hoc signed.
  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Dependencies
        run: bun install --frozen-lockfile
      - name: Build and package
        run: |
          for target in linux-x64-baseline:linux-x64 linux-arm64:linux-arm64 darwin-arm64:macos-arm64 darwin-x64:macos-x64; do
            bun_target="${target%%:*}"; release_name="${target##*:}"
            mkdir -p "dist-$release_name"
            bun build --compile --minify --target="bun-$bun_target" src/main.ts --outfile "dist-$release_name/loadout"
            tar -C "dist-$release_name" -czf "loadout-${GITHUB_REF_NAME}-$release_name.tar.gz" loadout
          done
      - name: The runner's own binary reports the tag
        run: |
          [ "$(dist-linux-x64/loadout --version)" = "loadout version ${GITHUB_REF_NAME#v}" ] || { echo "::error::dist-linux-x64/loadout --version: $(dist-linux-x64/loadout --version)"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          files: loadout-*.tar.gz
