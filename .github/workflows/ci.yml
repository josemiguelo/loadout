name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and unit tests
        run: go vet ./... && go test ./...
      - name: Build
        run: go build -o build/loadout ./cmd/loadout
      - name: Integration tests
        run: ./integration/run-tests.sh
      - name: Cross-build every release target
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/loadout
          done

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and unit tests
        run: go vet ./... && go test ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o build/loadout ./cmd/loadout
      - name: Integration tests
        run: ./integration/run-tests.sh
