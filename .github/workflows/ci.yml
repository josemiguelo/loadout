name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Dependencies
        run: bun install --frozen-lockfile
      - name: Types and unit tests
        run: bunx tsc --noEmit -p . && bun test src
      - name: Build
        run: bun run build
      - name: Integration tests
        run: ./integration/run-tests.sh build/loadout
      - name: Cross-build every release target
        run: |
          for target in linux-x64-baseline linux-arm64 darwin-arm64 darwin-x64; do
            bun build --compile --minify --target="bun-$target" src/main.ts --outfile "$RUNNER_TEMP/loadout-$target"
          done

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Dependencies
        run: bun install --frozen-lockfile
      - name: Types and unit tests
        run: bunx tsc --noEmit -p . && bun test src
      - name: Build
        run: bun run build
      - name: Integration tests
        run: ./integration/run-tests.sh build/loadout
