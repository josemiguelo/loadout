org.gradle.jvmargs=-Xmx4g
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
# macOS targets are declared but can only build on a macOS host; don't warn on Linux.
kotlin.native.ignoreDisabledTargets=true
# macOS binaries build on a macOS host (CI and release); Linux never cross-compiles their klibs.
kotlin.native.enableKlibsCrossCompilation=false
# nativeMain uses the signals cinterop; commonize it so the shared source set sees one API.
kotlin.mpp.enableCInteropCommonization=true
